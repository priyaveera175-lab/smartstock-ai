[project]
name = "smart_stock_ai_demo"
version = "0.1.0"
description = "smart_stock_ai_demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.32,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_stock_ai_demo"]

[tool.crewai]
type = "flow"
definition = "src/smart_stock_ai_demo/flow.json"
project_id = "84743290-216c-4796-b9fb-22c2e408d2c0"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
constraint-dependencies = ["crewai==1.15.32"]
